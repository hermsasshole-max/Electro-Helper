name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Ensure Wrapper Executable & Dependencies
        run: |
          if [ -d "./android" ]; then
            cd android
          fi
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x ./gradlew || true

      - name: Build Debug APK
        run: |
          if [ -d "./android" ] && [ -f "./android/gradlew" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace
          else
            ./gradlew assembleDebug --stacktrace
          fi

      - name: List Generated APKs
        run: |
          find . -name "*.apk" -type f

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectroAssistant-SA-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
